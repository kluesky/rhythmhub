# netlify.toml
[build]
  command = "npm run build"
  publish = "dist"

# Pastikan asset CSS dan JS tidak kena redirect
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200
  force = false

# Redirect semua route ke index.html (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
